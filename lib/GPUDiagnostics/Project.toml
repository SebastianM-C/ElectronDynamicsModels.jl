name = "GPUDiagnostics"
uuid = "5ccc9b3c-1187-41e2-9266-b19f02873332"
authors = ["Sebastian Micluța-Câmpeanu <sebastian.mc95@proton.me> and contributors"]
version = "0.1.0"

[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"

[weakdeps]
AMDGPU = "21141c5a-9bdb-4563-92ae-f87d6854732e"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
GPUCompiler = "61eb1bfa-7361-4325-ad38-22787b887f55"
LLVM = "929cbde3-209d-540e-8aea-75f648917ca0"

# GPUCompiler and LLVM are always loaded whenever a vendor package is, so listing them as triggers
# costs nothing at runtime and lets the extensions `using` them explicitly instead of reaching
# through `AMDGPU.GPUCompiler` / `CUDACore.LLVM` (private bindings).
[extensions]
GPUDiagnosticsAMDGPUExt = ["AMDGPU", "GPUCompiler", "LLVM"]
GPUDiagnosticsCUDAExt = ["CUDA", "GPUCompiler", "LLVM"]

[compat]
AMDGPU = "2"
Adapt = "4"
Aqua = "0.8"
CUDA = "6"
GPUCompiler = "2"
KernelAbstractions = "0.9.41"
LLVM = "9"
LinearAlgebra = "1.10"
Test = "1"
julia = "1.10"

[extras]
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Aqua", "Test"]
